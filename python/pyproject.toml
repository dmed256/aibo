[project]
name = "aibo-server"
version = "0.2.0"
authors = [
  { name="David Medina", email="dmed256@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["emacs", "aibo"]
description = "aibo: AI partner"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.13.*",
  "asyncpg==0.29.*",
  "fastapi==0.*",
  "fire==0.5.*",
  "greenlet==2.0.*",
  "httpx==0.27.*",
  "pillow>=10.1",
  "pydantic==2.2.*",
  "psycopg[binary]==3.2.*",
  "sqlalchemy[asyncio]==2.0.21",
  "uvicorn[standard]==0.22.*",
  "websockets==12.*",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.19.*",
  "black==23.3.0",
  "isort==5.*",
  "mypy==1.5.1",
  "ruff==0.12.12",
  "pytest==7.4.*",
  "pytest-asyncio==0.21.*",
  "pytest-xdist==3.3.*",
]

[project.urls]
Homepage = "https://github.com/dmed256/aibo"

[tool.isort]
profile = "black"

[tool.mypy]
plugins = [
  "pydantic.mypy",
  "sqlalchemy.ext.mypy.plugin",
]
warn_redundant_casts = true
allow_redefinition = true
warn_unused_ignores = true
disallow_untyped_calls = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
follow_imports = "skip"
enable_incomplete_feature = ["Unpack"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/aibo"]

[tool.setuptools.package-data]
aibo = ["resources/docs/*.md", "resources/web/*.html", "resources/web/assets/*"]

[build-system]
requires = ["setuptools>=67.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Preserve the existing package-level re-export API.
"src/aibo/db/__init__.py" = ["F403"]
