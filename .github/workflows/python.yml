name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format, lint, test, type-check, and build
        run: bun run check
      - name: Share built assets with backend tests
        uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: python/src/aibo/resources/web/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    env:
      ENV: test
      AIBO_CACHE_DIR: /tmp/aibo-test-cache
      AIBO_DATABASE_URL: postgresql+asyncpg://aibo:aibo@127.0.0.1:5432/aibo_test
      AIBO_POSTGRES_TEST_URL: postgresql+asyncpg://aibo:aibo@127.0.0.1:5432/aibo_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: aibo_test
          POSTGRES_USER: aibo
          POSTGRES_PASSWORD: aibo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: python/src/aibo/resources/web/
      - name: Formatting
        run: |
          black --check src/aibo
          isort --check-only src/aibo
      - name: Lint and types
        run: |
          ruff check src/aibo
          mypy src/aibo
      - name: Migrations
        run: python -m aibo.cli.migrate
      - name: Tests, including PostgreSQL concurrency
        run: pytest -q

  emacs:
    name: Emacs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y emacs-nox
          python -m pip install pexpect==4.9.0 wcwidth==0.2.13
      - name: Formatting and syntax
        run: emacs -Q --batch -l scripts/elisp-format.el -f aibo-format-check
      - name: Strict byte compilation
        shell: bash
        run: |
          directory=$(mktemp -d)
          cp elisp/*.el "$directory/"
          mapfile -t sources < <(find "$directory" -name '*.el' ! -name aibo-pkg.el | sort)
          emacs -Q --batch --eval '(setq load-prefer-newer t byte-compile-error-on-warn t)' \
            -L "$directory" -f batch-byte-compile "${sources[@]}"
      - name: ERT tests
        run: |
          emacs -Q --batch --eval '(setq load-prefer-newer t)' -L elisp -L elisp/tests \
            -l aibo-test-suite -f ert-run-tests-batch-and-exit
      - name: Terminal decoder, comparison, scrolling, and resizing tests
        run: python -m unittest discover -s elisp/tests/terminal -p 'test_*.py'
      - name: Retain failing terminal captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emacs-debug
          path: /tmp/aibo-*
          if-no-files-found: ignore
          retention-days: 7
