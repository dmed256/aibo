default_install_hook_types: [pre-push]
repos:
- repo: https://github.com/psf/black
  rev: 23.3.0
  hooks:
  - id: black
    types_or: [python]
    stages: [push]

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.5.1
  hooks:
  - id: mypy
    args: ["--config-file", "python/pyproject.toml"]
    types_or: [python]
    stages: [push]
    additional_dependencies:
      [
        "aiosqlite",
        "alembic",
        "asyncpg",
        "fastapi",
        "fire",
        "greenlet",
        "pydantic",
        "psycopg[binary]",
        "sqlalchemy[asyncio]",
        "websockets",
      ]

- repo: https://github.com/pycqa/isort
  rev: 5.12.0
  hooks:
  - id: isort
    types_or: [python]
    stages: [push]

- repo: local
  hooks:
  - id: web
    name: web
    entry: bun run --cwd web check
    language: system
    pass_filenames: false
    files: ^web/
    stages: [push]
